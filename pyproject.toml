[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rizzo-flow"
version = "0.1.0"
description = "Local typed decisions and numeric estimates with Spark-X2.5-4B"
# 3.11.4: llama_release.unpack extracts with tarfile's filter="data" (PEP 706), which the
# 3.11.0 to 3.11.3 releases do not have.
requires-python = ">=3.11.4"
# The default runtime is llama.cpp: prebuilt binaries fetched by `rizzo download`, driven through
# ctypes, so it adds no Python dependency besides jinja2 (chat template of the GGUF file).
# fastapi 0.132 is the first with strict_content_type, on by default: a body sent without a JSON
# Content-Type is not read as JSON. Before, a body with no Content-Type at all was, and a page on
# another site can send that to the local API without a CORS preflight.
dependencies = ["pydantic>=2.11,<3", "fastapi>=0.132,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4"]

[project.optional-dependencies]
# Optional second runtime (`--backend mlx`): pick at most one. All three are MLX, only the
# compute package differs. mlx = Apple Silicon (Metal) · cuda = NVIDIA GPU · cpu = no GPU.
mlx = [
  "mlx==0.32.2",
  "mlx-lm==0.31.3",
  "huggingface-hub>=1.0",  # config.download_model imports it directly
  "spark-mlx-llm @ git+https://github.com/XHToken/Spark-MLX-LLM.git@de2b4379fa1e2f2e1f99d84c83f0e008f651d86c",
]
cuda = [
  "mlx==0.32.2",
  "mlx-cuda-13==0.32.2; sys_platform != 'darwin'",
  "mlx-lm==0.31.3",
  "huggingface-hub>=1.0",  # config.download_model imports it directly
  "spark-mlx-llm @ git+https://github.com/XHToken/Spark-MLX-LLM.git@de2b4379fa1e2f2e1f99d84c83f0e008f651d86c",
]
cpu = [
  "mlx==0.32.2",
  "mlx-cpu==0.32.2; sys_platform != 'darwin'",
  "mlx-lm==0.31.3",
  "huggingface-hub>=1.0",  # config.download_model imports it directly
  "spark-mlx-llm @ git+https://github.com/XHToken/Spark-MLX-LLM.git@de2b4379fa1e2f2e1f99d84c83f0e008f651d86c",
]
# Development: tests (random order), linter, formatter, type checker, dependency checker, mutation
# testing.
test = [
  "pytest>=8.4,<10",
  "httpx>=0.28,<1",
  "ruff>=0.16",
  "pytest-randomly>=5.0",
  "pytest-timeout>=2.4",
  "mypy>=2.3",
  "mutmut>=3.8",
  "deptry>=0.25",
]

[tool.uv]
# mlx-cuda-13 and mlx-cpu ship the same library files, so they cannot share an environment.
conflicts = [[{ extra = "cuda" }, { extra = "cpu" }]]
# Only the Linux wheel of mlx-cuda-13 needs NCCL, which has no Windows build; uv reads one
# wheel's metadata for every platform, so restrict it by hand.
override-dependencies = ["nvidia-nccl-cu13; sys_platform == 'linux'"]

[project.scripts]
rizzo = "rizzo_flow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rizzo_flow"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
timeout = 120
# Warnings raised or triggered by this package or its tests fail the run; warnings that
# third-party packages raise among themselves (at import, say) are only reported. So do the two
# ways an error escapes the test that caused it: an exception in a finalizer (a leaked file whose
# ResourceWarning is an error above) and one in a thread.
filterwarnings = [
  "error::Warning:rizzo_flow",
  "error::Warning:test_",
  "error::Warning:conftest",
  "error::pytest.PytestUnraisableExceptionWarning",
  "error::pytest.PytestUnhandledThreadExceptionWarning",
]
markers = ["mlx: small real Spark architecture tests; requires MLX", "integration: requires downloaded Spark weights"]

[tool.ruff]
line-length = 100
# training/ is left out for now: it has 16 findings of the rules below (S310, S311, B905,
# PERF401, E731) that have to be settled before it can be checked.
extend-exclude = ["results", ".research", "models", "runtimes", "training", "mutants"]

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus the families that catch bugs, insecure calls and
# outdated idioms. PLW1514 is a preview rule, enabled alone: files are always opened as UTF-8.
select = [
  "E4", "E7", "E9", "F", "W",
  "A", "ASYNC", "B", "BLE", "C4", "DTZ", "EXE", "FLY", "FURB", "G", "I", "ICN", "ISC", "LOG",
  "PERF", "PGH", "PIE", "PLE", "PLW", "PT", "RET", "RSE", "RUF", "S", "SIM", "SLOT", "T10",
  "TID", "UP", "YTT",
  "PLW1514",
]
preview = true
explicit-preview-rules = true
allowed-confusables = ["–"]  # en dash in "A–Z"

# Every subprocess call would be flagged (rules S603, S607); they are reviewed by hand.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]  # asserts, fake tokens and temporary paths

[tool.mypy]
# Not 3.11: the stubs of numpy (reached through MLX's, which mypy always reads) use 3.12 syntax.
# Ruff still targets 3.11 (requires-python) and rejects newer syntax in our code.
python_version = "3.12"
mypy_path = "src"  # the package itself, also when mypy gets an explicit file list
files = ["src", "tests", "scripts", "skills/rizzo-flow/scripts"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined", "unused-awaitable",
]

[[tool.mypy.overrides]]
# Optional MLX runtime and its dependencies: not installed everywhere.
module = ["mlx.*", "mlx_lm.*", "spark_mlx_llm.*", "huggingface_hub.*", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# SemIf's own modules, imported from its checkout (.research/SemIf) at run time.
module = ["evaluate", "semif_phase1"]
ignore_missing_imports = true

[tool.deptry]
known_first_party = ["rizzo_flow"]
optional_dependencies_dev_groups = ["test"]
package_module_name_map = { spark-mlx-llm = "spark_mlx_llm" }

[tool.deptry.per_rule_ignores]
# Installed for the MLX runtime, imported by spark-mlx-llm and mlx rather than by this package.
DEP002 = ["mlx-lm", "mlx-cuda-13", "mlx-cpu"]

[tool.mutmut]
# Mutation testing, by hand: `uv run --no-sync mutmut run`, a few minutes on a machine with many
# cores. mutmut edits the code one place at a time and runs the tests that reach that function, in
# mutants/ (git-ignored), where it copies src/, tests/ and this file. `mutmut results` lists the
# edits the tests let through, `mutmut show NAME` and `mutmut browse` show them as diffs. Verdicts
# are cached per function: after editing tests, retest with `mutmut run 'rizzo_flow.<module>.*'`,
# or delete mutants/.
# What survives once tests/test_mutation_<module>.py are in place are edits that no test can tell
# from the original, such as "UTF-8" for "utf-8", `zip(strict=True)` over lists that are equally
# long by construction, or a header name in capitals that urllib capitalizes anyway.
source_paths = ["src"]
# What the tests read from the repository root (they run from mutants/).
also_copy = ["request.schema.json", "response.schema.json", "scripts", "skills"]
# Fixed order and no cache: a verdict must not depend on which mutant ran before.
pytest_add_cli_args = ["-p", "no:randomly", "-p", "no:cacheprovider"]
# The MLX tests start threads that do not survive a plain fork: the tests of the backends hang in
# the forked mutant and every one of those mutants times out. The fork server imports the tests
# once, then forks each mutant from there.
process_isolation = "forkserver"
